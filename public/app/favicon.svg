<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF7A00" />
      <stop offset="70%" stop-color="#E65100" />
      <stop offset="100%" stop-color="#BF360C" />
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB" />
      <stop offset="30%" stop-color="#FCD34D" />
      <stop offset="70%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Outer Circle -->
  <circle cx="64" cy="64" r="62" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="4" />
  <circle cx="64" cy="64" r="56" fill="none" stroke="#FDE68A" stroke-width="1.2" stroke-dasharray="3 2" opacity="0.85" />

  <!-- Temple Dome / Shikhar & Kalash Silhouette in Radiant Gold -->
  <g filter="url(#glow)">
    <!-- Flag / Dhwaja at top -->
    <path d="M64 16 L64 30 M64 16 L82 23 L64 30 Z" fill="#FFD54F" stroke="#B45309" stroke-width="1.2" stroke-linejoin="round" />
    
    <!-- Kalash / Amrit Kumbh -->
    <circle cx="64" cy="33" r="4.5" fill="url(#goldGrad)" stroke="#B45309" stroke-width="1" />
    
    <!-- Main Shikhar (Temple Dome) -->
    <path d="M64 37 C54 50 42 66 38 78 C36 84 40 86 64 86 C88 86 92 84 90 78 C86 66 74 50 64 37 Z" fill="url(#goldGrad)" stroke="#B45309" stroke-width="1.5" />
    
    <!-- Inner Sanctum Arch / Garbhagriha Arch -->
    <path d="M52 86 C52 70 76 70 76 86 Z" fill="#881337" />
    
    <!-- Divine Golden Flame (Jyoti) -->
    <path d="M64 71 C61 75 60 78 64 82 C68 78 67 75 64 71 Z" fill="#FDE047" stroke="#EA580C" stroke-width="0.8" />
    
    <!-- Temple Base Platform -->
    <rect x="26" y="86" width="76" height="8" rx="3" fill="url(#goldGrad)" stroke="#B45309" stroke-width="1.2" />
    <rect x="22" y="94" width="84" height="7" rx="3" fill="url(#goldGrad)" stroke="#B45309" stroke-width="1.2" />
    
    <!-- Sacred Text MVD / Om -->
    <text x="64" y="115" font-family="'Poppins', sans-serif" font-size="14" font-weight="900" fill="#FFFBEB" text-anchor="middle" letter-spacing="1">MVDV</text>
  </g>
</svg>